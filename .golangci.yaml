version: "2"
run:
  go: "1.26.2"
  timeout: "30s"
  tests: false
  build-tags:
    - debug
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - bodyclose
    - errname
    - embeddedstructfieldcheck
    - exptostd
    - gocheckcompilerdirectives
    - nilerr
    - nolintlint
    - tagalign
    - tagliatelle
    - depguard
  settings:
    tagliatelle:
      case:
        rules:
          json: camel
          yaml: camel
    depguard:
      rules:
        main:
          deny:
            - pkg: "gopkg.in/yaml.v3$"
              desc: "use github.com/goccy/go-yaml"
            - pkg: "gopkg.in/yaml.v2$"
              desc: "use github.com/goccy/go-yaml"
            - pkg: "github.com/duakc/lightddns/script/goscript/*"
              desc: "main project can not import script module"
    staticcheck:
      checks:
        - all
        - -S1000
        - -S1008
        - -S1017
        - -ST1001
        - -ST1003
        - -QF1001
        - -QF1003
        - -QF1008
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
      - script/goscript
formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - prefix(github.com/duakc/lightddns/)
        - prefix(github.com/duakc/)
        - default
      custom-order: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$