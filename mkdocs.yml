# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

site_name: Lightddns
site_url: https://lightddns.duaky.com
site_author: duakc
repo_url: https://github.com/duakc/lightddns
repo_name: duakc/lightddns
copyright: Copyright &copy; 2026 duakc
site_description: Lightweight DDNS(Dynamic DNS) Prog.
remote_branch: ci/docs
edit_uri: ""
nav:
  - Home: index.md
  - Manual:
      - Installation: manual/installation.md
      - Getting Started: manual/getting-started.md
      - How It Works: manual/how-it-works.md
  - Configuration:
      - Options: configuration/options.md
      - Log: configuration/log.md
      - Domain: configuration/domain.md
      - Datasources:
          - HTTP: configuration/datasource/http.md
          - Netlink: configuration/datasource/netlink.md
          - Command: configuration/datasource/command.md
          - Sum: configuration/datasource/sum.md
          - Failover: configuration/datasource/failover.md
      - Providers:
          - Cloudflare: configuration/provider/cloudflare.md
      - Shared:
          - ConnectOption: configuration/shared/connect.md
          - HTTPOption: configuration/shared/http.md
theme:
  name: material
  features:
#   mkdocs_static_i18n:
#   mkdocs-material language switcher contextual link is not compatible with
#   theme.features = navigation.instant
#    - navigation.instant
#    - navigation.instant.progress
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.prune
    - search.suggest
    - search.highlight
  font:
    text: Roboto
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/weather-night
        name: Switch to system preference
plugins:
  - privacy
  - search:
      lang: en
  - i18n:
      reconfigure_material: true
      reconfigure_search: true
      fallback_to_default: true
      docs_structure: folder
      languages:
        - locale: en
          name: English
          build: true
          default: true
        - locale: zh
          name: 简体中文
          build: true
          default: false
          nav_translations:
            Home: Home
            Manual: 手册
            Installation: 安装
            Getting Started: 快速开始
            How It Works: 工作原理
            Configuration: 配置
            Options: 配置文件
            Log: 日志
            Domain: 域名
            Datasources: 数据源
            HTTP: HTTP
            Netlink: Netlink
            Command: Command
            Sum: Sum
            Failover: Failover
            Providers: 服务提供方
            Cloudflare: Cloudflare
            Shared: 共享
            ConnectOption: ConnectOption
            HTTPOption: HTTPOption
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences