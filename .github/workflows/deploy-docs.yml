name: Deploy Docs
on:
  push:
    branches:
      - stable
      - testing
      - test/docs
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements.txt"
jobs:
  deploy:
    name: Deploy MkDocs to ci/docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy
        run: make deploy-docs
