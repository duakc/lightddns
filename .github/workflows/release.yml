name: Publish Release

on:
  push:
    branches:
      - ci_trigger/release
      - release
  workflow_dispatch:

# A release needs permission to create the GitHub Release and upload its assets.
permissions:
  contents: write

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-release-tag:
    name: Detect release tag on HEAD
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release-tag.outputs.tag }}
    steps:
      - name: Checkout release HEAD
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Find an unpublished tag on HEAD
        id: release-tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch --force --tags origin
          mapfile -t tags < <(git tag --points-at HEAD --sort=-version:refname)

          if [[ "${#tags[@]}" -eq 0 ]]; then
            echo 'No tag points at the release branch HEAD; skipping release.'
            exit 0
          fi
          if [[ "${#tags[@]}" -gt 1 ]]; then
            printf 'More than one tag points at HEAD: %s\n' "${tags[*]}" >&2
            exit 1
          fi

          tag="${tags[0]}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; skipping release."
            exit 0
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  approve-release:
    name: Approve publishing ${{ needs.detect-release-tag.outputs.tag }}
    needs: detect-release-tag
    if: needs.detect-release-tag.outputs.tag != ''
    runs-on: ubuntu-latest
    environment:
      name: release
    steps:
      - name: Await approval
        run: echo "Publishing ${{ needs.detect-release-tag.outputs.tag }} after environment approval."

  build:
    name: Build ${{ matrix.id }}
    needs:
      - detect-release-tag
      - approve-release
    if: needs.detect-release-tag.outputs.tag != '' && needs.approve-release.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        include:
          - id: darwin
            goos: darwin
            goarch: '*'
            packages: 'false'
          - id: freebsd
            goos: freebsd
            goarch: '*'
            packages: 'false'
          - id: openbsd
            goos: openbsd
            goarch: '*'
            packages: 'false'
          - id: windows
            goos: windows
            goarch: '*'
            packages: 'false'
          - id: linux-amd64
            goos: linux
            goarch: amd64
            packages: 'true'
          - id: linux-arm
            goos: linux
            goarch: arm
            packages: 'true'
          - id: linux-arm64
            goos: linux
            goarch: arm64
            packages: 'true'
          - id: linux-mips
            goos: linux
            goarch: mips
            packages: 'true'
          - id: linux-mipsle
            goos: linux
            goarch: mipsle
            packages: 'true'
          - id: linux-mips64
            goos: linux
            goarch: mips64
            packages: 'true'
          - id: linux-mips64le
            goos: linux
            goarch: mips64le
            packages: 'true'
          - id: linux-386
            goos: linux
            goarch: '386'
            packages: 'true'
          - id: linux-loong64
            goos: linux
            goarch: loong64
            packages: 'true'
          - id: linux-riscv64
            goos: linux
            goarch: riscv64
            packages: 'true'
    env:
      # Tag checkouts are detached; stamp the source release branch explicitly.
      GOSCRIPT_GIT_BRANCH: ${{ github.ref_name }}
      GOCACHE: ${{ github.workspace }}/.cache/go-build
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: refs/tags/${{ needs.detect-release-tag.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go module cache
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}

      - name: Restore target Go build cache
        id: go-build-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.GOCACHE }}
          key: gocache-${{ runner.os }}-${{ matrix.id }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            gocache-${{ runner.os }}-${{ matrix.id }}-${{ hashFiles('go.sum') }}-

      - name: Build release assets for ${{ matrix.id }}
        run: >-
          make build-release-target
          RELEASE_GOOS='${{ matrix.goos }}'
          RELEASE_GOARCH='${{ matrix.goarch }}'
          RELEASE_PACKAGES='${{ matrix.packages }}'

      - name: Compress standalone binaries
        shell: bash
        run: |
          set -euo pipefail
          find build/bin -type f -print0 | xargs -0 -r gzip --best

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.id }}
          path: |
            build/bin/**
            build/nfpm/**
          if-no-files-found: error
          retention-days: 1

      - name: Save target Go build cache
        if: always() && steps.go-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.GOCACHE }}
          key: ${{ steps.go-build-cache.outputs.cache-primary-key }}

  publish:
    name: Publish ${{ needs.detect-release-tag.outputs.tag }}
    needs:
      - detect-release-tag
      - approve-release
      - build
    if: needs.detect-release-tag.outputs.tag != '' && needs.approve-release.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: refs/tags/${{ needs.detect-release-tag.outputs.tag }}

      - name: Download release assets
        uses: actions/download-artifact@v5
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate release schema
        run: make generate-schema

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' binaries < <(find release-assets/bin -type f -name '*.gz' -print0)
          mapfile -d '' packages < <(find release-assets/nfpm -type f -print0)

          if [[ "${#binaries[@]}" -eq 0 ]]; then
            echo 'No compressed binaries were built.' >&2
            exit 1
          fi
          if [[ "${#packages[@]}" -eq 0 ]]; then
            echo 'No Linux packages were built.' >&2
            exit 1
          fi
          test -f release/schema.json

      - name: Generate release notes
        env:
          TAG: ${{ needs.detect-release-tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          changelog_section="$(mktemp)"
          awk -v heading="# $TAG" '
            $0 == heading { found = 1; next }
            found && /^# / { exit }
            found { print }
            END {
              if (!found) {
                exit 1
              }
            }
          ' release/CHANGE.md > "$changelog_section"

          if [[ ! -s "$changelog_section" ]]; then
            echo "No release notes found for $TAG in release/CHANGE.md." >&2
            exit 1
          fi

          previous_tag="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [[ -n "$previous_tag" ]]; then
            commit_range="${previous_tag}..${TAG}"
            comparison_label="${previous_tag}..${TAG}"
          else
            commit_range="$TAG"
            comparison_label="the beginning of the repository..${TAG}"
          fi

          {
            printf '# %s\n\n' "$TAG"
            printf '## New contributors\n\n'

            new_contributors=0
            while IFS=$'\t' read -r name email; do
              [[ -n "$email" ]] || continue
              if [[ -z "$previous_tag" ]] || ! git log "$previous_tag" --format='%aE' | grep --fixed-strings --line-regexp --quiet "$email"; then
                printf -- '- Congratulations to %s on becoming a new contributor!\n' "$name"
                new_contributors=1
              fi
            done < <(git log "$commit_range" --format='%aN%x09%aE' | awk -F '\t' '!seen[$2]++')

            if [[ "$new_contributors" -eq 0 ]]; then
              printf '%s\n' 'No new contributors in this release. Thank you to everyone who contributed.'
            fi

            printf '\n## Release notes\n\n'
            cat "$changelog_section"
            printf '\n## Commits since %s\n\n' "$comparison_label"
            git log "$commit_range" --format='- `%h` %s - %aN <%aE>'
          } > release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.detect-release-tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          assets=(release/schema.json)
          while IFS= read -r -d '' binary; do
            assets+=("$binary")
          done < <(find release-assets/bin -type f -name '*.gz' -print0)
          while IFS= read -r -d '' package; do
            assets+=("$package")
          done < <(find release-assets/nfpm -type f -print0)

          prerelease_args=()
          if [[ "$TAG" == *-* ]]; then
            prerelease_args=(--prerelease)
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            "${prerelease_args[@]}" \
            "${assets[@]}"
