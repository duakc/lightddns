name: Publish Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

# a release needs permission to create the GitHub Release and upload its assets.
permissions:
  contents: write

concurrency:
  group: publish-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  detect-release-tag:
    name: Detect release tag on HEAD
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release-tag.outputs.tag }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Find an unpublished tag on release HEAD
        id: release-tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch --force --tags origin
          git fetch --no-tags origin '+refs/heads/release:refs/remotes/origin/release'

          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo 'Publishing is triggered by a tag push; skipping this manual run.'
            exit 0
          fi

          tags=("$GITHUB_REF_NAME")

          tag="${tags[0]}"
          tag_commit="$(git rev-list -n 1 "refs/tags/$tag")"
          release_head="$(git rev-parse origin/release)"
          if [[ "$tag_commit" != "$release_head" ]]; then
            echo "Tag $tag does not point at the current release branch HEAD; skipping release."
            exit 0
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; skipping release."
            exit 0
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  approve-release:
    name: Approve publishing ${{ needs.detect-release-tag.outputs.tag }}
    needs: detect-release-tag
    if: needs.detect-release-tag.outputs.tag != ''
    runs-on: ubuntu-latest
    environment:
      name: release
    steps:
      - name: Await approval
        run: echo "Publishing ${{ needs.detect-release-tag.outputs.tag }} after environment approval."

  build:
    name: Build ${{ matrix.id }}
    needs:
      - detect-release-tag
      - approve-release
    if: needs.detect-release-tag.outputs.tag != '' && needs.approve-release.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 14
      matrix:
        include:
          - { id: darwin, goos: darwin, goarch: "*", packing: false }
          - { id: freebsd, goos: freebsd, goarch: "*", packing: false }
          - { id: openbsd, goos: openbsd, goarch: "*", packing: false }
          - { id: windows, goos: windows, goarch: "*", packing: false }
          - { id: linux-amd64, goos: linux, goarch: amd64, packing: true }
          - { id: linux-arm, goos: linux, goarch: arm, packing: true }
          - { id: linux-arm64, goos: linux, goarch: arm64, packing: true }
          - { id: linux-mips, goos: linux, goarch: mips, packing: true }
          - { id: linux-mipsle, goos: linux, goarch: mipsle, packing: true }
          - { id: linux-mips64, goos: linux, goarch: mips64, packing: true }
          - { id: linux-mips64le, goos: linux, goarch: mips64le, packing: true }
          - { id: linux-386, goos: linux, goarch: "386", packing: true }
          - { id: linux-loong64, goos: linux, goarch: loong64, packing: true }
          - { id: linux-riscv64, goos: linux, goarch: riscv64, packing: true }
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go-build
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: refs/tags/${{ needs.detect-release-tag.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go module cache
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}

      - name: Restore target Go build cache
        id: go-build-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.GOCACHE }}
          key: gocache-${{ runner.os }}-${{ matrix.id }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            gocache-${{ runner.os }}-${{ matrix.id }}-${{ hashFiles('go.sum') }}-

      - name: Build release binaries for ${{ matrix.id }}
        run: >-
          make build-release-binary
          BUILD_GOOS='${{ matrix.goos }}'
          BUILD_GOARCH='${{ matrix.goarch }}'

      - name: Build release packages for ${{ matrix.id }}
        if: matrix.packing
        run: >-
          make build-release-package
          BUILD_GOARCH='${{ matrix.goarch }}'

      - name: Save target Go build cache
        if: always() && steps.go-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.GOCACHE }}
          key: ${{ steps.go-build-cache.outputs.cache-primary-key }}

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.id }}
          path: |
            build/bin/**
            build/nfpm/**
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ needs.detect-release-tag.outputs.tag }}
    needs:
      - detect-release-tag
      - approve-release
      - build
    if: needs.detect-release-tag.outputs.tag != '' && needs.approve-release.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: refs/tags/${{ needs.detect-release-tag.outputs.tag }}

      - name: Download release assets
        uses: actions/download-artifact@v5
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Fetch release tags
        run: git fetch --force --tags origin

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate release schema
        run: make generate-schema

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' binaries < <(find release-assets/bin -type f \( -name '*.gz' -o -name '*.exe' \) -print0)
          mapfile -d '' packages < <(find release-assets/nfpm -type f -print0)

          if [[ "${#binaries[@]}" -eq 0 ]]; then
            echo 'No release binaries were built.' >&2
            exit 1
          fi
          if [[ "${#packages[@]}" -eq 0 ]]; then
            echo 'No Linux packages were built.' >&2
            exit 1
          fi
          test -f release/schema.json

      - name: Generate release notes
        env:
          TAG: ${{ needs.detect-release-tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          changelog_section="$(mktemp)"
          awk -v heading="# $TAG" '
            $0 == heading { found = 1; next }
            found && /^# / { exit }
            found { print }
            END {
              if (!found) {
                exit 1
              }
            }
          ' release/CHANGE.md > "$changelog_section"

          if [[ ! -s "$changelog_section" ]]; then
            echo "No release notes found for $TAG in release/CHANGE.md." >&2
            exit 1
          fi

          previous_tag="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [[ -n "$previous_tag" ]]; then
            commit_range="${previous_tag}..${TAG}"
            comparison_label="${previous_tag}..${TAG}"
          else
            commit_range="$TAG"
            comparison_label="the beginning of the repository..${TAG}"
          fi

          {
            printf '# %s\n\n' "$TAG"
            printf '## New contributors\n\n'

            new_contributors=0
            while IFS=$'\t' read -r name email; do
              [[ -n "$email" ]] || continue
              if [[ -z "$previous_tag" ]] || ! git log "$previous_tag" --format='%aE' | grep --fixed-strings --line-regexp --quiet "$email"; then
                printf -- '- Congratulations to %s on becoming a new contributor!\n' "$name"
                new_contributors=1
              fi
            done < <(git log "$commit_range" --format='%aN%x09%aE' | awk -F '\t' '!seen[$2]++')

            if [[ "$new_contributors" -eq 0 ]]; then
              printf '%s\n' 'No new contributors in this release. Thank you to everyone who contributed.'
            fi

            printf '\n## Release notes\n\n'
            cat "$changelog_section"
            printf '\n## Commits since %s\n\n' "$comparison_label"
            git log "$commit_range" --format='- `%h` %s - %aN <%aE>'
          } > release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.detect-release-tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          assets=(release/schema.json)
          while IFS= read -r -d '' binary; do
            assets+=("$binary")
          done < <(find release-assets/bin -type f \( -name '*.gz' -o -name '*.exe' \) -print0)
          while IFS= read -r -d '' package; do
            assets+=("$package")
          done < <(find release-assets/nfpm -type f -print0)

          prerelease_args=()
          if [[ "$TAG" == *-* ]]; then
            prerelease_args=(--prerelease)
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            "${prerelease_args[@]}" \
            "${assets[@]}"
