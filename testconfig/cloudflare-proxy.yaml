# yaml-language-server: $schema=../release/schema.json

log:
  level: debug

providers:
  - type: cloudflare
    name: pv-cf-proxy
    token: "{{ .Env.CLOUDFLARE_TOKEN }}"
    proxy: true

datasources:
  - type: command
    name: ds-proxy
    cmd: ["cat", "testconfig/testdata/ips-proxy"]

domains:
  - enabled: true
    domain: "proxied.{{ .Env.TEST_ZONE_CLOUDFLARE }}"
    datasource: ds-proxy
    provider: pv-cf-proxy
    timeout: 15s
    interval: 30s

services:
  - enabled: true
    type: prometheus
    port: 9801
  - enabled: true
    type: ipserver
    port: 8080
