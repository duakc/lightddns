# yaml-language-server: $schema=../release/schema.json

log:
  level: debug

providers:
  - type: cloudflare
    name: pv-cf-datasource-filter
    token: "{{ .Env.CLOUDFLARE_TOKEN }}"

datasources:
  - type: command
    name: ds-filter-source
    cmd: ["cat", "testconfig/testdata/ips"]
  - type: filter
    name: ds-filter
    datasources: [ds-filter-source]
    rules:
      - prefixes: ["1.1.1.0/24"]
        invert: false
      - prefixes: ["8.8.8.0/24"]
        invert: true

domains:
  - enabled: true
    domain: "datasource-filter-only.{{ .Env.TEST_ZONE_CLOUDFLARE }}"
    datasource: ds-filter
    provider: pv-cf-datasource-filter
    ipv4: true
    ipv6: false
    timeout: 15s
    interval: 30s

services: []
