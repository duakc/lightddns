# yaml-language-server: $schema=../release/schema.json

log:
  level: debug

providers:
  - type: aliyun
    name: pv-ct
    accessKeyId: "{{ .Env.ALIYUN_ACCESSKEY_ID }}"
    accessKeySecret: "{{ .Env.ALIYUN_ACCESSKEY_SECRET }}"
    lines: telecom
  - type: aliyun
    name: pv-cu
    accessKeyId: "{{ .Env.ALIYUN_ACCESSKEY_ID }}"
    accessKeySecret: "{{ .Env.ALIYUN_ACCESSKEY_SECRET }}"
    lines: unicom
  - type: aliyun
    name: pv-cm
    accessKeyId: "{{ .Env.ALIYUN_ACCESSKEY_ID }}"
    accessKeySecret: "{{ .Env.ALIYUN_ACCESSKEY_SECRET }}"
    lines: mobile
  - type: aliyun
    name: pv-default
    accessKeyId: "{{ .Env.ALIYUN_ACCESSKEY_ID }}"
    accessKeySecret: "{{ .Env.ALIYUN_ACCESSKEY_SECRET }}"
    lines: default

datasources:
  - type: command
    name: ds-ct
    cmd: ["cat", "testconfig/testdata/ips-ct"]
  - type: command
    name: ds-cu
    cmd: ["cat", "testconfig/testdata/ips-cu"]
  - type: command
    name: ds-cm
    cmd: ["cat", "testconfig/testdata/ips-cm"]
  - type: command
    name: ds-default
    cmd: ["cat", "testconfig/testdata/ips-default"]

domains:
  - enabled: true
    domain: "{{ .Env.TEST_ZONE_ALIYUN }}"
    datasource: ds-default
    provider: pv-default
    timeout: 15s
    interval: 15s
  - enabled: true
    domain: "{{ .Env.TEST_ZONE_ALIYUN }}"
    provider: pv-ct
    datasource: ds-ct
    timeout: 15s
    interval: 15s
  - enabled: true
    domain: "{{ .Env.TEST_ZONE_ALIYUN }}"
    datasource: ds-cu
    provider: pv-cu
    timeout: 15s
    interval: 15s
  - enabled: true
    domain: "{{ .Env.TEST_ZONE_ALIYUN }}"
    datasource: ds-cm
    provider: pv-cm
    timeout: 15s
    interval: 15s

services:
  - enabled: true
    type: prometheus
    port: 9801
  - enabled: true
    type: ipserver
    port: 8080
