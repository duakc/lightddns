# yaml-language-server: $schema=../release/schema.json

log:
  level: debug

providers:
  - type: cloudflare
    name: pv-cf-dns-tls-shorthand
    token: "{{ .Env.CLOUDFLARE_TOKEN }}"
    dns: "tls://{{ .Env.TEST_DNS_SERVER }}:853"

datasources:
  - type: command
    name: ds-dns-tls-shorthand
    cmd: ["cat", "testconfig/testdata/ips"]

domains:
  - enabled: true
    domain: "dns-tls-shorthand.{{ .Env.TEST_ZONE_CLOUDFLARE }}"
    datasource: ds-dns-tls-shorthand
    provider: pv-cf-dns-tls-shorthand
    ipv4: true
    ipv6: false
    timeout: 15s
    interval: 30s

services: []
