# yaml-language-server: $schema=../release/schema.json

log:
  level: debug

providers:
  - type: tencentcloud
    name: pv-ct
    secretId: "{{ .Env.TENCENT_SECRET_ID }}"
    secretKey: "{{ .Env.TENCENT_SECRET_KEY }}"
    lines: 电信
  - type: tencentcloud
    name: pv-cu
    secretId: "{{ .Env.TENCENT_SECRET_ID }}"
    secretKey: "{{ .Env.TENCENT_SECRET_KEY }}"
    lines: 联通
  - type: tencentcloud
    name: pv-cm
    secretId: "{{ .Env.TENCENT_SECRET_ID }}"
    secretKey: "{{ .Env.TENCENT_SECRET_KEY }}"
    lines: 移动
  - type: tencentcloud
    name: pv-default
    secretId: "{{ .Env.TENCENT_SECRET_ID }}"
    secretKey: "{{ .Env.TENCENT_SECRET_KEY }}"
    lines: 默认

datasources:
  - type: command
    name: ds-ct
    cmd: ["cat", "testconfig/testdata/ips-ct"]
  - type: command
    name: ds-cu
    cmd: ["cat", "testconfig/testdata/ips-cu"]
  - type: command
    name: ds-cm
    cmd: ["cat", "testconfig/testdata/ips-cm"]
  - type: command
    name: ds-default
    cmd: ["cat", "testconfig/testdata/ips-default"]

domains:
  - enabled: true
    domain: "{{ .Env.TEST_ZONE_TENCENT }}"
    datasource: ds-default
    provider: pv-default
    timeout: 15s
    interval: 15s
  - enabled: true
    domain: "{{ .Env.TEST_ZONE_TENCENT }}"
    provider: pv-ct
    datasource: ds-ct
    timeout: 15s
    interval: 15s
  - enabled: true
    domain: "{{ .Env.TEST_ZONE_TENCENT }}"
    datasource: ds-cu
    provider: pv-cu
    timeout: 15s
    interval: 15s
  - enabled: true
    domain: "{{ .Env.TEST_ZONE_TENCENT }}"
    datasource: ds-cm
    provider: pv-cm
    timeout: 15s
    interval: 15s

services:
  - enabled: true
    type: prometheus
    port: 9801
  - enabled: true
    type: ipserver
    port: 8080
