# yaml-language-server: $schema=../release/schema.json

log:
  level: debug

providers:
  - type: cloudflare
    name: pv-cf-http-proxy-http-only
    token: "{{ .Env.CLOUDFLARE_TOKEN }}"
    http:
      httpProxy: "{{ .Env.TEST_HTTP_PROXY }}"

datasources:
  - type: command
    name: ds-http-proxy-http-only
    cmd: ["cat", "testconfig/testdata/ips"]

domains:
  - enabled: true
    domain: "http-proxy-http-only.{{ .Env.TEST_ZONE_CLOUDFLARE }}"
    datasource: ds-http-proxy-http-only
    provider: pv-cf-http-proxy-http-only
    ipv4: true
    ipv6: false
    timeout: 15s
    interval: 30s

services: []
