# yaml-language-server: $schema=../release/schema.json

log:
  level: debug

providers:
  - type: cloudflare
    name: pv-cf-bind-interface
    token: "{{ .Env.CLOUDFLARE_TOKEN }}"
    connect:
      bindInterface: "{{ .Env.TEST_NETLINK_INTERFACE }}"

datasources:
  - type: command
    name: ds-bind-interface
    cmd: ["cat", "testconfig/testdata/ips"]

domains:
  - enabled: true
    domain: "connect-bind-interface.{{ .Env.TEST_ZONE_CLOUDFLARE }}"
    datasource: ds-bind-interface
    provider: pv-cf-bind-interface
    ipv4: true
    ipv6: false
    timeout: 15s
    interval: 30s

services: []
