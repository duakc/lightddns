# yaml-language-server: $schema=../release/schema.json

log:
  level: debug

providers:
  - type: cloudflare
    name: pv-cf-command-streams
    token: "{{ .Env.CLOUDFLARE_TOKEN }}"

datasources:
  - type: command
    name: ds-command-streams
    cmd:
      - sh
      - -c
      - 'cat testconfig/testdata/stream-stdout; cat testconfig/testdata/stream-stderr >&2'
    output: all
    capture: all

domains:
  - enabled: true
    domain: "datasource-command-streams.{{ .Env.TEST_ZONE_CLOUDFLARE }}"
    datasource: ds-command-streams
    provider: pv-cf-command-streams
    ipv4: true
    ipv6: false
    timeout: 15s
    interval: 30s

services: []
