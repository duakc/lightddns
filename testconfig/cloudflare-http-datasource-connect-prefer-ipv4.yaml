# yaml-language-server: $schema=../release/schema.json

log:
  level: debug

providers:
  - type: cloudflare
    name: pv-cf-http-ds-prefer-ipv4
    token: "{{ .Env.CLOUDFLARE_TOKEN }}"

datasources:
  - type: http
    name: ds-http-prefer-ipv4
    url: https://api.ip.sb/jsonip
    connect:
      dialStrategy: prefer_ipv4
    match:
      jq: ".ip"

domains:
  - enabled: true
    domain: "http-datasource-prefer-ipv4.{{ .Env.TEST_ZONE_CLOUDFLARE }}"
    datasource: ds-http-prefer-ipv4
    provider: pv-cf-http-ds-prefer-ipv4
    timeout: 30s
    interval: 1m

services: []
