# yaml-language-server: $schema=../release/schema.json

log:
  level: debug

providers:
  - type: cloudflare
    name: pv-cf-http-ds-connect-ipv6
    token: "{{ .Env.CLOUDFLARE_TOKEN }}"

datasources:
  - type: http
    name: ds-http-connect-ipv6
    url: https://api.ip.sb/jsonip
    connect:
      dialStrategy: ipv6_only
    match:
      jq: ".ip"

domains:
  - enabled: true
    domain: "http-datasource-connect-ipv6.{{ .Env.TEST_ZONE_CLOUDFLARE }}"
    datasource: ds-http-connect-ipv6
    provider: pv-cf-http-ds-connect-ipv6
    ipv4: false
    ipv6: true
    timeout: 30s
    interval: 1m

services: []
