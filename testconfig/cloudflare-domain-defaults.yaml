# yaml-language-server: $schema=../release/schema.json

log:
  level: debug

providers:
  - type: cloudflare
    name: pv-cf-domain-defaults
    token: "{{ .Env.CLOUDFLARE_TOKEN }}"

datasources:
  - type: command
    name: ds-domain-defaults
    cmd: ["cat", "testconfig/testdata/ips"]

domains:
  - enabled: true
    domain: "domain-defaults.{{ .Env.TEST_ZONE_CLOUDFLARE }}"
    ttl: 300
    ipv4: true
    ipv6: false
    timeout: 15s
    interval: 30s

services: []
