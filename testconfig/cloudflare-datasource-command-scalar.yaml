# yaml-language-server: $schema=../release/schema.json

log:
  level: debug

providers:
  - type: cloudflare
    name: pv-cf-command-scalar
    token: "{{ .Env.CLOUDFLARE_TOKEN }}"

datasources:
  - type: command
    name: ds-command-scalar
    cmd: cat
    output: stdout
    workDir: testconfig/testdata
    stdin: ips

domains:
  - enabled: true
    domain: "datasource-command-scalar.{{ .Env.TEST_ZONE_CLOUDFLARE }}"
    datasource: ds-command-scalar
    provider: pv-cf-command-scalar
    ipv4: true
    ipv6: false
    timeout: 15s
    interval: 30s

services: []
