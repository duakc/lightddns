# yaml-language-server: $schema=../release/schema.json

log:
  level: debug
  disabled: true

providers:
  - type: cloudflare
    name: pv-cf-log-disabled
    token: "{{ .Env.CLOUDFLARE_TOKEN }}"

datasources:
  - type: command
    name: ds-log-disabled
    cmd: ["cat", "testconfig/testdata/ips"]

domains:
  - enabled: true
    domain: "log-disabled.{{ .Env.TEST_ZONE_CLOUDFLARE }}"
    datasource: ds-log-disabled
    provider: pv-cf-log-disabled
    ipv4: true
    ipv6: false
    timeout: 15s
    interval: 30s

services: []
