# yaml-language-server: $schema=../release/schema.json

log:
  level: debug

providers:
  - type: cloudflare
    name: pv-cf-bind-address4
    token: "{{ .Env.CLOUDFLARE_TOKEN }}"
    connect:
      dialStrategy: ipv4_only
      bindAddress4: "{{ .Env.TEST_BIND_ADDRESS4 }}"

datasources:
  - type: command
    name: ds-bind-address4
    cmd: ["cat", "testconfig/testdata/ips"]

domains:
  - enabled: true
    domain: "connect-bind-address-ipv4.{{ .Env.TEST_ZONE_CLOUDFLARE }}"
    datasource: ds-bind-address4
    provider: pv-cf-bind-address4
    ipv4: true
    ipv6: false
    timeout: 15s
    interval: 30s

services: []
