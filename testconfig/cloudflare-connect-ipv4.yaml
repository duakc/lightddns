# yaml-language-server: $schema=../release/schema.json

log:
  level: debug

providers:
  - type: cloudflare
    name: pv-cf-connect-ipv4
    token: "{{ .Env.CLOUDFLARE_TOKEN }}"
    connect:
      dialStrategy: ipv4_only

datasources:
  - type: command
    name: ds-connect-ipv4
    cmd: ["cat", "testconfig/testdata/ips"]

domains:
  - enabled: true
    domain: "connect-ipv4.{{ .Env.TEST_ZONE_CLOUDFLARE }}"
    datasource: ds-connect-ipv4
    provider: pv-cf-connect-ipv4
    ipv4: true
    ipv6: false
    timeout: 15s
    interval: 30s

services: []
