# yaml-language-server: $schema=../release/schema.json

log:
  level: debug

providers:
  - type: cloudflare
    name: pv-cf-connect-ipv6
    token: "{{ .Env.CLOUDFLARE_TOKEN }}"
    connect:
      dialStrategy: ipv6_only

datasources:
  - type: command
    name: ds-connect-ipv6
    cmd: ["cat", "testconfig/testdata/ips"]

domains:
  - enabled: true
    domain: "connect-ipv6.{{ .Env.TEST_ZONE_CLOUDFLARE }}"
    datasource: ds-connect-ipv6
    provider: pv-cf-connect-ipv6
    ipv4: false
    ipv6: true
    timeout: 15s
    interval: 30s

services: []
