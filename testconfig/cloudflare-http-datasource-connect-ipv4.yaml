# yaml-language-server: $schema=../release/schema.json

log:
  level: debug

providers:
  - type: cloudflare
    name: pv-cf-http-ds-connect-ipv4
    token: "{{ .Env.CLOUDFLARE_TOKEN }}"

datasources:
  - type: http
    name: ds-http-connect-ipv4
    url: https://api.ip.sb/jsonip
    connect:
      dialStrategy: ipv4_only
    match:
      jq: ".ip"

domains:
  - enabled: true
    domain: "http-datasource-connect-ipv4.{{ .Env.TEST_ZONE_CLOUDFLARE }}"
    datasource: ds-http-connect-ipv4
    provider: pv-cf-http-ds-connect-ipv4
    ipv4: true
    ipv6: false
    timeout: 30s
    interval: 1m

services: []
