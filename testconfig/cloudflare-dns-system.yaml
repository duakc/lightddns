# yaml-language-server: $schema=../release/schema.json

log:
  level: debug

providers:
  - type: cloudflare
    name: pv-cf-dns-system
    token: "{{ .Env.CLOUDFLARE_TOKEN }}"
    dns: system

datasources:
  - type: command
    name: ds-dns-system
    cmd: ["cat", "testconfig/testdata/ips"]

domains:
  - enabled: true
    domain: "dns-system.{{ .Env.TEST_ZONE_CLOUDFLARE }}"
    datasource: ds-dns-system
    provider: pv-cf-dns-system
    ipv4: true
    ipv6: false
    timeout: 15s
    interval: 30s

services: []
