# yaml-language-server: $schema=../release/schema.json

log:
  level: debug

providers:
  - type: cloudflare
    name: pv-cf-command-stdin
    token: "{{ .Env.CLOUDFLARE_TOKEN }}"

datasources:
  - type: command
    name: ds-command-stdin-file
    cmd: ["cat"]
    workDir: testconfig/testdata
    stdin: ips
    capture: stdout

domains:
  - enabled: true
    domain: "datasource-command-stdin.{{ .Env.TEST_ZONE_CLOUDFLARE }}"
    datasource: ds-command-stdin-file
    provider: pv-cf-command-stdin
    ipv4: true
    ipv6: false
    timeout: 15s
    interval: 30s

services: []
