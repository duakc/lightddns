# yaml-language-server: $schema=../release/schema.json

log:
  level: debug

providers:
  - type: cloudflare
    name: pv-cf-system-proxy
    token: "{{ .Env.CLOUDFLARE_TOKEN }}"
    http:
      useSystemProxy: true

datasources:
  - type: command
    name: ds-system-proxy
    cmd: ["cat", "testconfig/testdata/ips"]

domains:
  - enabled: true
    domain: "http-system-proxy.{{ .Env.TEST_ZONE_CLOUDFLARE }}"
    datasource: ds-system-proxy
    provider: pv-cf-system-proxy
    ipv4: true
    ipv6: false
    timeout: 15s
    interval: 30s

services: []
