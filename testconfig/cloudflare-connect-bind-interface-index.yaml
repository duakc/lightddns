# yaml-language-server: $schema=../release/schema.json

log:
  level: debug

providers:
  - type: cloudflare
    name: pv-cf-bind-interface-index
    token: "{{ .Env.CLOUDFLARE_TOKEN }}"
    connect:
      bindInterface: "{{ .Env.TEST_NETLINK_IFINDEX }}"

datasources:
  - type: command
    name: ds-bind-interface-index
    cmd: ["cat", "testconfig/testdata/ips"]

domains:
  - enabled: true
    domain: "connect-bind-interface-index.{{ .Env.TEST_ZONE_CLOUDFLARE }}"
    datasource: ds-bind-interface-index
    provider: pv-cf-bind-interface-index
    ipv4: true
    ipv6: false
    timeout: 15s
    interval: 30s

services: []
