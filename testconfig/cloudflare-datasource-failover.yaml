# yaml-language-server: $schema=../release/schema.json

log:
  level: debug

providers:
  - type: cloudflare
    name: pv-cf-datasource-failover
    token: "{{ .Env.CLOUDFLARE_TOKEN }}"

datasources:
  - type: command
    name: ds-failover-primary
    cmd: ["sh", "-c", "exit 1"]
  - type: command
    name: ds-failover-backup
    cmd: ["cat", "testconfig/testdata/ips"]
  - type: failover
    name: ds-failover
    datasources: [ds-failover-primary, ds-failover-backup]

domains:
  - enabled: true
    domain: "datasource-failover-only.{{ .Env.TEST_ZONE_CLOUDFLARE }}"
    datasource: ds-failover
    provider: pv-cf-datasource-failover
    ipv4: true
    ipv6: false
    timeout: 15s
    interval: 30s

services: []
