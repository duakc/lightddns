# yaml-language-server: $schema=../release/schema.json

log:
  level: debug

providers:
  - type: cloudflare
    name: pv-cf-connect-fwmark
    token: "{{ .Env.CLOUDFLARE_TOKEN }}"
    connect:
      fwmark: "{{ .Env.TEST_FWMARK }}"

datasources:
  - type: command
    name: ds-connect-fwmark
    cmd: ["cat", "testconfig/testdata/ips"]

domains:
  - enabled: true
    domain: "connect-fwmark.{{ .Env.TEST_ZONE_CLOUDFLARE }}"
    datasource: ds-connect-fwmark
    provider: pv-cf-connect-fwmark
    ipv4: true
    ipv6: false
    timeout: 15s
    interval: 30s

services: []
